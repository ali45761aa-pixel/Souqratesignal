# ─── Nginx Virtual Hosts Configuration ───────────────────────────────────────
# Server: 194.163.155.52
# Site 1: SouqrateX (existing) — served from /var/www/souqratex or port 3001
# Site 2: AI Agent Platform — souqratesignal.online → port 3000
# ─────────────────────────────────────────────────────────────────────────────

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ── Gzip ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── Rate Limiting ─────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    # ═══════════════════════════════════════════════════════════════════════════
    # SITE 1: SouqrateX (existing site — keep as-is)
    # This block serves the existing SouqrateX site on its own domain
    # ═══════════════════════════════════════════════════════════════════════════

    # HTTP → HTTPS redirect for SouqrateX
    server {
        listen 80;
        server_name souqrates.online www.souqrates.online;
        return 301 https://$host$request_uri;
    }

    # SouqrateX HTTPS
    server {
        listen 443 ssl http2;
        server_name souqrates.online www.souqrates.online;

        ssl_certificate     /etc/letsencrypt/live/souqrates.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/souqrates.online/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Serve SouqrateX static files (adjust path if needed)
        root /var/www/souqratex;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # SITE 2: AI Agent Platform — souqratesignal.online
    # ═══════════════════════════════════════════════════════════════════════════

    # HTTP → HTTPS redirect for AI Platform
    server {
        listen 80;
        server_name souqratesignal.online www.souqratesignal.online;
        return 301 https://$host$request_uri;
    }

    # AI Agent Platform HTTPS
    server {
        listen 443 ssl http2;
        server_name souqratesignal.online www.souqratesignal.online;

        ssl_certificate     /etc/letsencrypt/live/souqratesignal.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/souqratesignal.online/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        client_max_body_size 50M;

        # ── Proxy to AI Agent Platform (Docker container on port 3000) ────────
        location / {
            proxy_pass         http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
        }

        # ── SSE (Server-Sent Events for AI streaming) ─────────────────────────
        location /api/agents/execute-step {
            proxy_pass         http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header   Connection '';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 600s;
            chunked_transfer_encoding on;
        }

        # ── API Rate Limiting ─────────────────────────────────────────────────
        location /api/agents/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass         http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # DEFAULT: Catch-all (returns 444 for unknown domains)
    # ═══════════════════════════════════════════════════════════════════════════
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate     /etc/letsencrypt/live/souqratesignal.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/souqratesignal.online/privkey.pem;
        return 444;
    }
}
