# ─── AI Agent Platform - Docker Compose for Contabo VPS ──────────────────────
# Server: 194.163.155.52
# Domain: souqratesignal.online
# DB: Supabase (external PostgreSQL)
# NOTE: Nginx runs on HOST (not in Docker) to share server with SouqrateX
# Usage: cp .env.production.example .env.production && nano .env.production && docker-compose up -d

version: '3.8'

services:
  # ── Main Application ────────────────────────────────────────────────────────
  app:
    build: .
    container_name: ai_agent_app
    ports:
      - "127.0.0.1:3000:3000"   # Only accessible locally — host Nginx proxies to it
    env_file:
      - .env.production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Redis (for sessions/cache) ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai_agent_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme123}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"   # Only accessible locally
    restart: unless-stopped

volumes:
  redis_data:
