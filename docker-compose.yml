# ─── AI Agent Platform - Docker Compose ──────────────────────────────────────
# Domain: souqratesignal.online | DB: Supabase | Server: Contabo VPS
# Usage: cp .env.production.example .env.production && nano .env.production && docker-compose up -d

version: '3.8'

services:
  app:
    build: .
    container_name: ai_agent_app
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.production
    restart: unless-stopped
    networks:
      - ai-agent-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: ai_agent_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - ai-agent-network

  redis:
    image: redis:7-alpine
    container_name: ai_agent_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme123}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - ai-agent-network

volumes:
  redis_data:

networks:
  ai-agent-network:
    driver: bridge
