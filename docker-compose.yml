# ─── AI Agent Platform - Docker Compose ──────────────────────────────────────
# For self-hosting on Contabo VPS or any Docker host
# Usage: docker-compose up -d

version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
      # AI Keys (set in .env file)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      # Payment
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - PAYMOB_API_KEY=${PAYMOB_API_KEY}
      # Crypto Wallets
      - WALLET_USDT_TRC20=${WALLET_USDT_TRC20}
      - WALLET_USDT_BEP20=${WALLET_USDT_BEP20}
      - WALLET_BTC=${WALLET_BTC}
      - WALLET_ETH=${WALLET_ETH}
      - WALLET_TON=${WALLET_TON}
      - WALLET_BNB=${WALLET_BNB}
      # Storage
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
      - AWS_REGION=${AWS_REGION}
      # Email
      - RESEND_API_KEY=${RESEND_API_KEY}
      # Deploy
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - VERCEL_TOKEN=${VERCEL_TOKEN}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - ai-agent-network

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=ai_agent_platform
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./drizzle/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - ai-agent-network

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - ai-agent-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - ai-agent-network

volumes:
  postgres_data:
  redis_data:

networks:
  ai-agent-network:
    driver: bridge
